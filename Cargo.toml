[package]
name = "solo_clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { path = "../zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_windows = { path = "../zed/crates/gpui_windows", default-features = false }
clipboard-win = "5.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0"

[patch.crates-io]
# 如果遇到网络问题，可以尝试使用镜像源

[profile.dev]
opt-level = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
